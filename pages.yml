media:
  input: photos
  output: photos

content:
  - name: listing
    label: Car listing
    type: file
    path: content.json
    format: json
    fields:
      - name: title
        label: Title (year, make, model)
        type: string
      - name: price
        label: Price
        type: string
      - name: photos
        label: Photos (the first one is the big cover photo)
        type: image
        options:
          multiple:
            max: 40
          rename: true
      - name: specs
        label: Details
        type: object
        list: true
        fields:
          - name: label
            label: Label (e.g. Mileage)
            type: string
          - name: value
            label: Value (e.g. 98,000 mi)
            type: string
      - name: description
        label: Description (each line becomes its own line on the page)
        type: text
      - name: phone
        label: Phone number to text
        type: string
      - name: footer
        label: Bottom note (location, payment, etc.)
        type: string
