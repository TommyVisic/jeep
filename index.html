<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car for sale</title>
<style>
  :root {
    --bg: #0f0f10; --card: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
    --accent: #f59e0b; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* Hero */
  .hero { position: relative; height: 70vh; min-height: 380px; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0;
                 background: linear-gradient(to top, var(--bg) 5%, transparent 60%); }
  .hero .wrap { position: absolute; left: 0; right: 0; bottom: 28px; z-index: 1; }
  h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.1; letter-spacing: -.02em; }
  .price { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 999px;
           background: var(--accent); color: #111; font-weight: 700; font-size: 1.25rem; }

  section { padding: 36px 0; }
  h2 { font-size: .8rem; letter-spacing: .15em; text-transform: uppercase;
       color: var(--muted); margin-bottom: 16px; }

  /* Specs */
  .specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .spec { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
  .spec span { display: block; color: var(--muted); font-size: .8rem; }
  .spec strong { font-size: 1.1rem; }
  .notes { margin-top: 20px; color: #d4d4d8; max-width: 70ch; white-space: pre-line; }

  /* Gallery */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .gallery a { display: block; aspect-ratio: 4/3; overflow: hidden; border-radius: var(--radius); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
  .gallery a:hover img { transform: scale(1.05); }

  /* Contact */
  .contact { background: var(--card); border-radius: var(--radius); padding: 24px; text-align: center; }
  .contact a { color: var(--accent); font-weight: 600; font-size: 1.2rem; text-decoration: none; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 30px 0 40px; }

  /* Lightbox (native <dialog>, no libraries) */
  dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh;
           width: 100vw; height: 100vh; }
  dialog::backdrop { background: rgba(0,0,0,.92); }
  dialog img { position: absolute; inset: 0; margin: auto; max-width: 94vw; max-height: 88vh;
               object-fit: contain; border-radius: 6px; }
  .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12);
            color: #fff; border: 0; width: 48px; height: 48px; border-radius: 50%; font-size: 24px;
            cursor: pointer; }
  .lb-btn:hover { background: rgba(255,255,255,.25); }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-close { top: 30px; right: 16px; transform: none; }
  .lb-count { position: absolute; bottom: 16px; width: 100%; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<!-- All content comes from content.json (edited via Pages CMS). -->
<header class="hero">
  <img id="cover" alt="">
  <div class="wrap">
    <h1 id="title"></h1>
    <div class="price" id="price"></div>
  </div>
</header>

<main class="wrap">
  <section>
    <h2>Details</h2>
    <div class="specs" id="specs"></div>
    <p class="notes" id="description"></p>
  </section>

  <section>
    <h2>Photos</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section>
    <h2>Interested?</h2>
    <div class="contact">
      <p>Text or call</p>
      <a id="phone"></a>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<dialog id="lb">
  <img id="lb-img" alt="">
  <button class="lb-btn lb-close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
  <button class="lb-btn lb-next" aria-label="Next">›</button>
  <div class="lb-count" id="lb-count"></div>
</dialog>

<script>
  let links = [];
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const node = Object.assign(document.createElement(tag), props);
    kids.forEach(k => node.appendChild(k));
    return node;
  };
  const src = p => String(p).replace(/^\/+/, '');   // keep paths relative

  fetch('content.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
    const photos = (d.photos || []).map(src);
    document.title = `${d.title} — ${d.price}`;
    $('title').textContent = d.title || '';
    $('price').textContent = d.price || '';
    $('description').textContent = d.description || '';
    $('footer').textContent = d.footer || '';
    if (photos[0]) $('cover').src = photos[0];
    const digits = (d.phone || '').replace(/[^\d+]/g, '');
    $('phone').textContent = d.phone || '';
    $('phone').href = `sms:${digits}`;
    (d.specs || []).forEach(s => $('specs').appendChild(
      el('div', { className: 'spec' }, [el('span', { textContent: s.label }), el('strong', { textContent: s.value })])));
    photos.forEach((p, n) => {
      const a = el('a', { href: p }, [el('img', { src: p, alt: '', loading: 'lazy' })]);
      a.addEventListener('click', e => { e.preventDefault(); show(n); lb.showModal(); });
      $('gallery').appendChild(a);
      links.push(a);
    });
  });

  const lb = document.getElementById('lb'), img = document.getElementById('lb-img'),
        count = document.getElementById('lb-count');
  let i = 0;
  const show = n => { i = (n + links.length) % links.length; img.src = links[i].href;
                      count.textContent = `${i + 1} / ${links.length}`; };
  lb.querySelector('.lb-prev').onclick = () => show(i - 1);
  lb.querySelector('.lb-next').onclick = () => show(i + 1);
  lb.querySelector('.lb-close').onclick = () => lb.close();
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
  document.addEventListener('keydown', e => {
    if (!lb.open) return;
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });
  // Swipe on phones
  let x0 = null;
  lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });
</script>
</body>
</html>
